<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A hub with its spokes — the site's whole subject in 32px. -->
  <rect width="32" height="32" rx="7" fill="#12151c"/>
  <g stroke="#5fa3a3" stroke-width="1.6" opacity="0.75">
    <line x1="16" y1="16" x2="7"  y2="8"/>
    <line x1="16" y1="16" x2="25" y2="9"/>
    <line x1="16" y1="16" x2="6"  y2="22"/>
    <line x1="16" y1="16" x2="24" y2="24"/>
    <line x1="16" y1="16" x2="16" y2="27"/>
  </g>
  <g fill="#5fa3a3">
    <circle cx="7"  cy="8"  r="2.4"/>
    <circle cx="25" cy="9"  r="2.4"/>
    <circle cx="6"  cy="22" r="2.4"/>
    <circle cx="24" cy="24" r="2.4"/>
    <circle cx="16" cy="27" r="2.4"/>
  </g>
  <circle cx="16" cy="16" r="5" fill="#e0a458"/>
</svg>
